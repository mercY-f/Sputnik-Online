<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TERMINATOR TEST [1-BIT BAYER 4x4]</title>
  <style>
    :root {
      --paper: #F4F1EA;
      --ink: #0E0E0E;
      --ink-muted: #5C5A54;
      --surface: #E8E4DA;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      line-height: 1.4;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      user-select: none;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    .hud {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: var(--surface);
      border: 1px solid var(--ink);
      padding: 12px 16px;
      pointer-events: none;
    }
    .hud h1 {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }
    .hud p {
      color: var(--ink-muted);
      margin-bottom: 4px;
    }
    .hud .status {
      color: var(--ink);
      font-weight: 700;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="hud">
    <h1>TERMINATOR PROTOTYPE // BAYER 4x4</h1>
    <p>WORLD-SPACE NORMAL · uSunDir · 1-BIT DITHERING</p>
    <p>NIGHT_MAX_DENSITY = 0.75 · NO DISCARD</p>
    <div class="status">DRAG TO ROTATE CAMERA // SUN FIXED</div>
  </div>
  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from './vendor/three.module.min.js';

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 40, 260);

    const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio || 1);
    container.appendChild(renderer.domElement);

    // Uniforms
    const uniforms = {
      uSunDir: { value: new THREE.Vector3(1.0, 0.2, 0.8).normalize() },
      uDayColor: { value: new THREE.Vector3(244 / 255, 241 / 255, 234 / 255) },
      uNightColor: { value: new THREE.Vector3(14 / 255, 14 / 255, 14 / 255) },
      uNightMaxDensity: { value: 0.75 },
      uEnabled: { value: 1.0 }
    };

    const vertexShader = `
      varying vec3 vWorldNormal;
      void main() {
        vWorldNormal = normalize((modelMatrix * vec4(normal, 0.0)).xyz);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `;

    const fragmentShader = `
      precision highp float;
      uniform vec3 uSunDir;
      uniform vec3 uDayColor;
      uniform vec3 uNightColor;
      uniform float uNightMaxDensity;
      uniform float uEnabled;
      varying vec3 vWorldNormal;

      float getBayer4x4(vec2 pos) {
        int x = int(mod(pos.x, 4.0));
        int y = int(mod(pos.y, 4.0));
        if (y == 0) {
          if (x == 0) return 0.5 / 16.0;
          if (x == 1) return 8.5 / 16.0;
          if (x == 2) return 2.5 / 16.0;
          return 10.5 / 16.0;
        }
        if (y == 1) {
          if (x == 0) return 12.5 / 16.0;
          if (x == 1) return 4.5 / 16.0;
          if (x == 2) return 14.5 / 16.0;
          return 6.5 / 16.0;
        }
        if (y == 2) {
          if (x == 0) return 3.5 / 16.0;
          if (x == 1) return 11.5 / 16.0;
          if (x == 2) return 1.5 / 16.0;
          return 9.5 / 16.0;
        }
        if (x == 0) return 15.5 / 16.0;
        if (x == 1) return 7.5 / 16.0;
        if (x == 2) return 13.5 / 16.0;
        return 5.5 / 16.0;
      }

      void main() {
        if (uEnabled < 0.5) {
          gl_FragColor = vec4(uDayColor, 1.0);
          return;
        }
        vec3 norm = normalize(vWorldNormal);
        float b = dot(norm, normalize(uSunDir));
        float shade = 1.0 - smoothstep(-0.15, 0.15, b);
        shade = min(shade, uNightMaxDensity);

        float bayer = getBayer4x4(gl_FragCoord.xy);
        vec3 col = (shade > bayer) ? uNightColor : uDayColor;
        gl_FragColor = vec4(col, 1.0);
      }
    `;

    const terminatorMaterial = new THREE.ShaderMaterial({
      uniforms: uniforms,
      vertexShader: vertexShader,
      fragmentShader: fragmentShader
    });

    const sphereGeom = new THREE.SphereGeometry(75, 64, 32);
    const globeMesh = new THREE.Mesh(sphereGeom, terminatorMaterial);
    scene.add(globeMesh);

    // Inverted hull contour for visual fidelity
    const hullGeom = new THREE.SphereGeometry(75 * 1.012, 64, 32);
    const hullMat = new THREE.MeshBasicMaterial({
      color: 0x0E0E0E,
      side: THREE.BackSide
    });
    const hullMesh = new THREE.Mesh(hullGeom, hullMat);
    scene.add(hullMesh);

    // Drag interaction to rotate camera around sphere
    let isDragging = false;
    let prevMouseX = 0;
    let prevMouseY = 0;
    let camTheta = 0;
    let camPhi = Math.PI / 2 - 0.15;
    const camDist = 260;

    function updateCameraPos() {
      camera.position.x = camDist * Math.sin(camPhi) * Math.sin(camTheta);
      camera.position.y = camDist * Math.cos(camPhi);
      camera.position.z = camDist * Math.sin(camPhi) * Math.cos(camTheta);
      camera.lookAt(0, 0, 0);
    }
    updateCameraPos();

    window.addEventListener('mousedown', (e) => {
      isDragging = true;
      prevMouseX = e.clientX;
      prevMouseY = e.clientY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - prevMouseX;
      const dy = e.clientY - prevMouseY;
      prevMouseX = e.clientX;
      prevMouseY = e.clientY;

      camTheta -= dx * 0.008;
      camPhi = Math.max(0.1, Math.min(Math.PI - 0.1, camPhi - dy * 0.008));
      updateCameraPos();
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
